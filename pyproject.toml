[project]
name = "mcp-llm-gateway-assessment"
version = "1.0.0"
description = "MCP server, MCP security gateway, streaming PII redaction, and an LLM model router."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "pydantic>=2.12",
    "fastapi>=0.115",
    "uvicorn>=0.31",
    "httpx>=0.28",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --basetemp=.pytest_tmp"
